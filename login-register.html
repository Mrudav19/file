<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LifeCycle Platform - Login / Register</title>
  <link rel="stylesheet" href="stylelog.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
  <style>
    #login-message {
      margin-top: 10px;
      font-weight: bold;
    }
    #login-message.success {
      color: green;
    }
    #login-message.error {
      color: red;
    }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <div class="logo"><span class="logo-text">LifeCycle</span></div>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#contact">Contact</a></li>
        <li><a href="#health-records">Health Records</a></li>
        <li>
          <a href="javascript:void(0);" id="login-icon">
            <i class="fas fa-sign-in-alt"></i>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <!-- Login / Register Section -->
  <section id="login-section">
    <div class="container">
      <!-- Login Form -->
      <div id="login-form-container" class="form-container">
        <h2>Sign In</h2>
        <form id="login-form">
          <label for="login-email">Email:</label>
          <input type="email" id="login-email" name="email" required>

          <label for="login-password">Password:</label>
          <input type="password" id="login-password" name="password" required>

          <label>
            <input type="checkbox" id="remember-me"> Remember me
          </label>
          <a href="#">Forgot password?</a>

          <button type="submit">Sign In</button>
        </form>
        <p>Don't have an account? <a href="#" id="show-registration-form">Become a member</a></p>
      </div>

      <!-- Registration Form -->
      <div id="registration-form-container" class="form-container" style="display: none;">
        <h2>Create an Account</h2>
        <form id="registration-form">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>

          <label for="password">Password:</label>
          <input type="password" id="password" name="password" required>

          <button type="submit">Register</button>
        </form>
        <p>Already have an account? <a href="#" id="show-login-form">Sign In here</a></p>
      </div>
    </div>

    <!-- Message Display -->
    <div id="login-message"></div>
  </section>

  <!-- JavaScript -->
  <script>
    // Toggle login/register views
    document.getElementById('show-registration-form').addEventListener('click', () => {
      document.getElementById('login-form-container').style.display = 'none';
      document.getElementById('registration-form-container').style.display = 'block';
    });

    document.getElementById('show-login-form').addEventListener('click', () => {
      document.getElementById('registration-form-container').style.display = 'none';
      document.getElementById('login-form-container').style.display = 'block';
    });

    // Handle Registration
    document.getElementById('registration-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const userData = { name, email, password };
      localStorage.setItem('userData', JSON.stringify(userData));

      const msgBox = document.getElementById('login-message');
      msgBox.innerText = "Registration successful! Please log in.";
      msgBox.className = "success";

      document.getElementById('registration-form-container').style.display = 'none';
      document.getElementById('login-form-container').style.display = 'block';
    });

    // Handle Login
    document.getElementById('login-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const msgBox = document.getElementById('login-message');
      msgBox.className = "";

      const storedUserData = localStorage.getItem('userData');
      if (storedUserData) {
        const userData = JSON.parse(storedUserData);
        if (email === userData.email && password === userData.password) {
          localStorage.setItem('isLoggedIn', 'true');
          window.location.href = 'app.html';
        } else {
          msgBox.innerText = "Incorrect email or password!";
          msgBox.className = "error";
        }
      } else {
        msgBox.innerText = "No registered users found!";
        msgBox.className = "error";
      }
    });
  </script>
</body>
</html>
